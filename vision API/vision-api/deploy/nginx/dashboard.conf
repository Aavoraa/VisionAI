# Reverse proxy in front of the Next.js dashboard (docker-compose "dashboard-proxy" service).
#
# Why it exists: the dashboard forwards /api/* to the API, and the API throttles sign-in
# attempts per client IP. Next.js neither adds X-Forwarded-For nor strips one sent by the
# browser, so without this proxy the API would either see every user as the dashboard
# container (one shared throttle bucket) or trust an address the client made up.
# This proxy REPLACES X-Forwarded-For with the address of the peer it actually talked to;
# the API trusts that header only when the request comes from the dashboard container
# (uvicorn FORWARDED_ALLOW_IPS).
#
# If another proxy / load balancer terminates TLS in front of this one, $remote_addr is that
# balancer: configure ngx_http_realip_module (set_real_ip_from <balancer CIDR>;
# real_ip_header X-Forwarded-For;) so $remote_addr becomes the real client again.

upstream dashboard {
    server dashboard:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;

    # Dashboard traffic is small JSON, plus one image (max 10 MB) from the Playground page.
    client_max_body_size 11m;

    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # Playground requests wait for inference (the API gives up after
        # VISION_MODEL_TIMEOUT_SECONDS: 120 s by default, up to 300 s on CPU setups).
        proxy_read_timeout 360s;
    }
}
